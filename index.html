<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/output.css" />
    <title>Niko's Burguer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <header
      class="relative w-full h-[300px] bg-[url('../assets/bg-header.jpg')] bg-cover bg-center bg-no-repeat overflow-hidden"
    >
      <div class="absolute inset-0 bg-[#345334e5]"></div>
      <div
        class="relative z-10 w-full h-full flex items-center justify-between px-8"
      >
        <div>
          <div class="bg-[#EBCBB2] p-4 rounded-full ml-4">
            <img src="assets/Logo Nikos.png" alt="Logo Nikos" width="200px" />
          </div>
        </div>
        <div class="flex gap-12 text-white text-5xl">
          <i class="fa-brands fa-whatsapp"></i>
          <i class="fa-brands fa-instagram"></i>
          <i class="fa-brands fa-facebook"></i>
        </div>
      </div>
    </header>
    <main>
      <section
        class="w-[85%] max-w-[1200px] h-[500px] mt-30 mx-auto bg-[#2e412e] rounded-[24px] p-[2px] flex flex-col"
      >
        <div class="py-4.5">
          <h2 class="text-center text-2xl tracking-[0.6em] leading-none">
            COMBOS
          </h2>
        </div>

        <div class="flex-1 flex-row bg-white rounded-[24px] justify-center  flex gap-8 pt-5">
          <div class="w-[270px] text-center">
            <h3 class="mb-5">Combo Vegano</h3>
            <div class="bg-[#EBCBB2] h-[350px] rounded-2xl">
                <img src="assets/combo-vegano.jpg" alt="Combo Vegano" width="270px" height="300px" class="rounded-t-2xl"/>
                <p>
                    Pão artesanal, hambúrguer de grão de bico (100g), pasta de lentilha, cebola, tomate e molho de mostarda. Acompanha batata rústica e bebida.
                </p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer></footer>
  </body>
</html>
